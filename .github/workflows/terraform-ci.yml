name: Terraform CI

on:
  pull_request:
    branches:
      - main
      - master

jobs:
  terraform-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4.0.1

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v6.3.0
        with:
          tflint_version: v0.64.0

      - name: TFLint init
        run: tflint --init

      - name: Terraform fmt (check)
        run: terraform fmt -recursive -check

      - name: Terraform init + validate (root)
        run: |
          terraform init -backend=false
          terraform validate

      - name: Terraform test (unit — mock provider, no credentials needed)
        run: terraform test

      - name: TFLint recursive
        run: tflint --recursive

  security-scan:
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Run tfsec (non-blocking)
        uses: aquasecurity/tfsec-action@v1.0.3
